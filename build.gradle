plugins { id 'net.fabricmc.fabric-loom' version '1.16.3' }
version = '1.6.1'
group = 'com.celik.kingdomscombat'
base { archivesName = 'kingdoms-combat' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.160.0+26.2'
    compileOnly fileTree('libs') { include '*.jar' }
    compileOnly fileTree('libs/huskhomes-api') { include '*.jar' }
    runtimeOnly fileTree('libs') { include '*.jar'; exclude 'huskhomes-fabric-26.2.jar' }
    testImplementation files('libs/voicechat-fabric-2.6.22+26.2.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
sourceSets { integration { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath } }
loom {
    mods { kingdoms_combat { sourceSet sourceSets.main }; kingdoms_combat_test { sourceSet sourceSets.integration } }
    runs { integration { server(); source sourceSets.integration; runDir 'run-test'; vmArg '-Dkingdomscombat.integration=true' } }
}
tasks.named('runIntegration') {
    doFirst {
        file('run-test').mkdirs()
        file('run-test/result.txt').text = 'RUNNING\n'
        file('run-test/eula.txt').text = 'eula=true\n'
        file('run-test/server.properties').text = 'server-port=25692\nserver-ip=127.0.0.1\nonline-mode=false\nlevel-name=combat-test-world\nlevel-type=minecraft:flat\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\nspawn-protection=0\nmax-tick-time=-1\n'
    }
    doLast {
        def result = file('run-test/result.txt').text
        if (!result.startsWith('PASS ')) throw new GradleException(result)
        logger.lifecycle(result.trim())
    }
}
